services:
  redash-server:
    image: redash/redash:26.3.0
    command: server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5050:5000"
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash@postgres/redash"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_WEB_WORKERS: 2
      REDASH_SECRET_KEY: "redash-wire-dev-secret"
      REDASH_COOKIE_SECRET: "redash-wire-dev-cookie"

  redash-scheduler:
    image: redash/redash:26.3.0
    command: scheduler
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash@postgres/redash"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_SECRET_KEY: "redash-wire-dev-secret"
      REDASH_COOKIE_SECRET: "redash-wire-dev-cookie"

  redash-worker:
    image: redash/redash:26.3.0
    command: worker
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash@postgres/redash"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_SECRET_KEY: "redash-wire-dev-secret"
      REDASH_COOKIE_SECRET: "redash-wire-dev-cookie"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash
      POSTGRES_DB: redash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sample PostgreSQL database to use as a Redash data source
  sample-db:
    image: postgres:16-alpine
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sample MySQL database to use as a Redash data source
  sample-mysql:
    image: mysql:8.4
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample
      MYSQL_DATABASE: sample
    volumes:
      - ./dev/seed.mysql.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usample", "-psample"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
